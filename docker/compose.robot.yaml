services:
  mpc:
    image: ${ROBOT_TELEOP_MPC_IMAGE:-robot-teleoperation-framework:mpc-gui}
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    network_mode: host
    ipc: host
    environment:
      HOME: /tmp
      ROS_DOMAIN_ID: "77"
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      # GPU devices are not passed through to this development container.
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
      ROBOT_TELEOP_MAPPING: /var/lib/robot-teleoperation-dev/profiles/indy7_joint_mapping.yaml
      ROBOT_RVIZ_CONFIG: /var/lib/robot-teleoperation-dev/rviz/indy7.rviz
    volumes:
      - ../:/workspace:ro
      # Writable directory mount also persists RViz configs and atomic saves.
      - ../.docker-data/robot-mpc:/var/lib/robot-teleoperation-dev:rw
      - ../.docker-data/robot-mpc/profiles:/var/lib/robot-teleoperation-dev/profiles:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY_FILE:-${XAUTHORITY:-${HOME}/.Xauthority}}:/tmp/.Xauthority:ro
    command:
      - sleep
      - infinity

  dcp3:
    image: ${ROBOT_DCP3_IMAGE:-robot-teleoperation-framework:dcp3}
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    network_mode: host
    ipc: host
    environment:
      HOME: /tmp
      ROS_DOMAIN_ID: "77"
      ROBOT_IP: ${ROBOT_IP:?Set ROBOT_IP to the robot controller address}
    volumes:
      - ../:/workspace:ro
      - ../.docker-data/robot-dcp3:/var/lib/robot-teleoperation-dev
    command:
      - sleep
      - infinity
