services:
  mpc:
    image: ${ROBOT_TELEOP_MPC_IMAGE:-robot-teleoperation-framework:mpc-gui}
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    network_mode: host
    ipc: host
    environment:
      HOME: /tmp
      ROS_DOMAIN_ID: "77"
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      # GPU devices are not passed through to this development container.
      LIBGL_ALWAYS_SOFTWARE: "${LIBGL_ALWAYS_SOFTWARE:-1}"
      INDY7_TELEOP_MAPPING: /var/lib/robot-teleoperation-dev/profiles/indy7_joint_mapping.yaml
    volumes:
      - ../:/workspace:ro
      - ../.docker-data/indy7-mpc:/var/lib/robot-teleoperation-dev
      - ../.docker-data/indy7-mpc/profiles:/var/lib/robot-teleoperation-dev/profiles:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY_FILE:-${XAUTHORITY:-${HOME}/.Xauthority}}:/tmp/.Xauthority:ro
    command:
      - sleep
      - infinity

  dcp3:
    image: ${INDY7_DCP3_IMAGE:-robot-teleoperation-framework:dcp3}
    user: "${LOCAL_UID:-0}:${LOCAL_GID:-0}"
    network_mode: host
    ipc: host
    environment:
      HOME: /tmp
      ROS_DOMAIN_ID: "77"
      INDY7_ROBOT_IP: ${INDY7_ROBOT_IP:?Set INDY7_ROBOT_IP to the Indy7 controller address}
    volumes:
      - ../:/workspace:ro
      - ../.docker-data/dcp3:/var/lib/robot-teleoperation-dev
    command:
      - sleep
      - infinity
