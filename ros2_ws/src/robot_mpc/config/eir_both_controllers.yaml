    update_rate: 200
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    forward_position_controller:
      type: position_controllers/JointGroupPositionController
forward_position_controller:
  ros__parameters:
    joints:
    - Joint_L0
    - Joint_L1
    - Joint_L2_L
    - Joint_L3_L
    - Joint_L4_L
    - Joint_L5_L
    - Joint_L6_L
    - Joint_L7_L
    - Joint_L8_L
    - Joint_L2_R
    - Joint_L3_R
    - Joint_L4_R
    - Joint_L5_R
    - Joint_L6_R
    - Joint_L7_R
    - Joint_L8_R
    interface_name: position
