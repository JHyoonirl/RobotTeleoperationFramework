# Experiment configuration for the Indy7 Crocoddyl joint-position MPC node.
# Copy this file to a new name for each experiment and pass it with:
#   ros2 launch indy7_mpc indy7_mpc.launch.py config_file:=/path/to/my_run.yaml

crocoddyl_mpc:
  ros__parameters:
    # Primary controller: task-space SE(3) target on the URDF's tcp frame.
    control_mode: task_space
    task_frame: tcp
    pose_frame: world
    teleop_pose_topic: teleop/target_pose
    command_pose_topic: mpc/command_pose
    # Absolute joint positions [rad]. The simulation launch remaps this
    # common q_cmd boundary to /forward_position_controller/commands.
    joint_command_topic: mpc/joint_position_cmd

    # [x, y, z] [m], quaternion [x, y, z, w].
    # This pose is equivalent to the previous joint-space demo target.
    goal_position: [0.555628, -0.028394, 0.500983]
    goal_orientation_xyzw: [-0.019703, 0.987570, 0.119061, 0.100709]

    # Legacy joint target, used only with control_mode: joint.
    goal: [0.2, -0.3, -1.2, 0.2, -1.4, 0.15]

    # MPC discretization and solver budget.
    horizon: 20
    dt: 0.005
    max_solver_iterations: 10

    # MPC cost weights: SE(3) tracking + posture + velocity + torque
    # + soft joint-limit avoidance.
    se3_position_cost_weight: 3000.0
    se3_orientation_cost_weight: 150.0
    posture_cost_weight: 0.05
    velocity_cost_weight: 0.5
    torque_cost_weight: 0.0001
    # Legacy key accepted by the node but unused by the dynamic predictor.
    acceleration_cost_weight: 0.05
    joint_limit_cost_weight: 10.0
    running_cost_weight: 1.0
    terminal_cost_weight: 10.0
    nominal_posture: [0.0, 0.0, -1.57, 0.0, -1.57, 0.0]
    joint_limit_margin: 0.1
    torque_limits: [431.97, 431.97, 197.23, 79.79, 79.79, 79.79]
    acceleration_limits: [40.0, 40.0, 40.0, 40.0, 40.0, 40.0]

    # DLS IK is retained only to publish qref and provide a pose-to-joint
    # diagnostic. The actual MPC includes the SE(3) residual directly.
    ik_max_iterations: 150
    ik_damping: 0.001
    ik_step: 0.3

    # This is also read by the node when it is run directly.  The launch file
    # uses its simulate:= argument for the GUI/simulation process topology.
    simulate: true
    internal_simulation: false

    # Command-side safety filter. q_cmd is clipped to both the URDF hard
    # position limits and the measured-q +/- min(v_max*dt, increment) window.
    command_velocity_limits: [10.0, 10.0, 10.0, 10.0, 10.0, 10.0]
    command_increment_limits: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]

    # Cartesian line-reference generator.  0.05 m/s is a conservative
    # starting value. Orientation is limited independently in rad/s.
    cartesian_max_speed: 0.25
    cartesian_max_angular_speed: 2.0
    cartesian_speed_margin: 1.0
    cartesian_min_duration: 0.10
    cartesian_reference_topic: mpc/cartesian_reference_pose

    # Preview-only simulation stabilizers; they are not hardware parameters.
    simulation_damping: 5.0
    simulation_acceleration_smoothing: 0.25

    # One JSONL record per MPC cycle for post-run diagnosis.
    diagnostic_logging: true
    # Empty means ros2_ws/logs/indy7_mpc/<UTC run>/.
    diagnostic_log_directory: ""
    diagnostic_flush_period: 1.0
    diagnostic_log_prediction: true

    # The q_cmd boundary below enforces position, velocity and increment limits.
    # Dynamics predictions are only rejected when they are non-finite.
    stationary_hold_position_tolerance: 0.002
    stationary_hold_orientation_tolerance: 0.01
